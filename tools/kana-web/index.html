
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kana 3D Preview</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171124;
    }

    #kana-container {
      width: 100%;
      height: 100%;
    }

    #debug {
      position: fixed;
      z-index: 10;
      left: 8px;
      right: 8px;
      bottom: 8px;
      max-height: 35%;
      overflow: auto;
      padding: 10px;
      background: #160d20;
      color: #ffffff;
      font: 12px monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 1px solid #a78bfa;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="kana-container"></div>
  <pre id="debug">Kana debug panel ready.</pre>

  <script>
    window.addEventListener("error", (event) => {
      document.getElementById("debug").textContent +=
        "\nERROR: " + event.message;
    });

    window.addEventListener("unhandledrejection", (event) => {
      document.getElementById("debug").textContent +=
        "\nPROMISE ERROR: " + event.reason;
    });
  </script>

  <script type="module" src="/dist/main.js?v=10"></script>
</body>
</html>
